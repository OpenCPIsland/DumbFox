server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /jgc
    location /jgc/ {
        add_header X-Proxy-Test jgc always;
        proxy_pass http://23.254.248.158:5782/jgc/;
    }

    # /mix (NOTE: you had duplicate rules in Apache)
    location /mix/ {
        proxy_pass http://23.254.248.158:5783/mix/;
    }

    # backend 5784 services
    location /player/      { proxy_pass http://23.254.248.158:5784/player/; }
    location /game/        { proxy_pass http://23.254.248.158:5784/game/; }
    location /quest/       { proxy_pass http://23.254.248.158:5784/quest/; }
    location /task/        { proxy_pass http://23.254.248.158:5784/task/; }
    location /inventory/   { proxy_pass http://23.254.248.158:5784/inventory/; }
    location /reward/      { proxy_pass http://23.254.248.158:5784/reward/; }
    location /consumable/  { proxy_pass http://23.254.248.158:5784/consumable/; }
    location /igloo/       { proxy_pass http://23.254.248.158:5784/igloo/; }
    location /catalog/     { proxy_pass http://23.254.248.158:5784/catalog/; }
    location /breadcrumb/  { proxy_pass http://23.254.248.158:5784/breadcrumb/; }
    location /tutorial/    { proxy_pass http://23.254.248.158:5784/tutorial/; }
    location /captcha/     { proxy_pass http://23.254.248.158:5784/captcha/; }
    location /chat/        { proxy_pass http://23.254.248.158:5784/chat/; }
    location /minigame/    { proxy_pass http://23.254.248.158:5784/minigame/; }
    location /moderation/  { proxy_pass http://23.254.248.158:5784/moderation/; }
    location /disneystore/ { proxy_pass http://23.254.248.158:5784/disneystore/; }
    location /iap/         { proxy_pass http://23.254.248.158:5784/iap/; }
    location /iap-pc/      { proxy_pass http://23.254.248.158:5784/iap-pc/; }
    location /tube/        { proxy_pass http://23.254.248.158:5784/tube/; }
    location /event/       { proxy_pass http://23.254.248.158:5784/event/; }
    location /encryption-trusted/ { proxy_pass http://23.254.248.158:5784/encryption-trusted/; }
    location /membership/  { proxy_pass http://23.254.248.158:5784/membership/; }

    location ~* \.(js|css|wasm|data|bundle)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

